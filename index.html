<title>وقف الدجاجة | مشاوي الدجاج</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rakkas&family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-deep:#7A0E12;
    --bg-panel:#931418;
    --gold:#FDD134;
    --maroon:#D71E23;
    --olive:#5C0D10;
    --paprika:#FFB300;
    --cream:#FFF6DF;
    --cream-dim:#F0C6A0;
    --comb:#D71E23;
    --feather:#FDD134;
    --feather-dark:#E0AE12;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0;
    min-height:100vh;
    background:
      radial-gradient(circle at 50% 0%, #A8171C 0%, var(--bg-deep) 55%),
      var(--bg-deep);
    font-family:'Tajawal', sans-serif;
    color:var(--cream);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:28px 14px;
  }
  .stage{
    width:100%;
    max-width:560px;
    display:flex;
    flex-direction:column;
    align-items:center;
    text-align:center;
  }
  .brand-logo{
    height:88px;
    width:auto;
    margin-bottom:14px;
    border-radius:50%;
    filter:drop-shadow(0 3px 8px rgba(0,0,0,.4));
  }
  h1{
    font-family:'Rakkas', serif;
    font-size:clamp(30px,7.5vw,46px);
    margin:0 0 6px;
    text-shadow:0 2px 0 rgba(0,0,0,.35);
  }
  .sub{
    color:var(--cream-dim);
    font-size:14.5px;
    margin-bottom:22px;
    max-width:400px;
    line-height:1.8;
  }
  .sub b{ color:var(--paprika); }

  /* ---- Track ---- */
  .track-frame{
    width:100%;
    background:linear-gradient(180deg, #4A0C0F, var(--bg-panel));
    border:1px solid rgba(253,209,52,.3);
    border-radius:20px;
    padding:14px;
    box-shadow:0 16px 34px rgba(0,0,0,.45);
    margin-bottom:22px;
  }
  .track{
    position:relative;
    width:100%;
    height:120px;
    border-radius:14px;
    overflow:hidden;
    background:
      repeating-linear-gradient(90deg, #6E2412 0 2px, transparent 2px 40px),
      linear-gradient(180deg, #A6431F 0%, #7A2E15 60%, #4E1B0D 100%);
  }
  .track::before{ /* fence line at bottom */
    content:"";
    position:absolute;
    bottom:10px; left:0; right:0;
    height:3px;
    background:repeating-linear-gradient(90deg, rgba(245,237,224,.25) 0 10px, transparent 10px 22px);
  }

  .zone{
    position:absolute;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .zone img{
    width:100%;
    height:100%;
    display:block;
    filter:drop-shadow(0 0 10px rgba(253,209,52,.85)) drop-shadow(0 3px 6px rgba(0,0,0,.5));
    animation:pulse-glow 1.1s ease-in-out infinite;
  }
  @keyframes pulse-glow{
    0%,100%{ filter:drop-shadow(0 0 8px rgba(253,209,52,.75)) drop-shadow(0 3px 6px rgba(0,0,0,.5)); }
    50%{ filter:drop-shadow(0 0 16px rgba(253,209,52,1)) drop-shadow(0 3px 6px rgba(0,0,0,.5)); }
  }

  .chicken{
    position:absolute;
    top:14px;
    width:64px;
    height:64px;
    will-change:left;
  }
  .chicken svg{ width:100%; height:100%; display:block; }
  .chicken.walk-r{ transform: scaleX(1); }
  .chicken.walk-l{ transform: scaleX(-1); }

  .leg{ transform-origin: 50% 0%; animation: step .22s linear infinite; }
  .leg.b{ animation-delay:.11s; }
  @keyframes step{
    0%,100%{ transform: rotate(-18deg); }
    50%{ transform: rotate(18deg); }
  }

  /* ---- Controls ---- */
  .controls{
    display:flex;
    gap:14px;
    align-items:center;
    justify-content:center;
    margin-bottom:6px;
  }
  button#stopBtn{
    font-family:'Tajawal', sans-serif;
    font-weight:900;
    font-size:20px;
    letter-spacing:.02em;
    color:var(--cream);
    background:linear-gradient(180deg, #F03C41, var(--maroon));
    border:none;
    border-radius:999px;
    padding:17px 60px;
    cursor:pointer;
    box-shadow:0 8px 0 #6B0D10, 0 14px 24px rgba(0,0,0,.45);
    transition:transform .1s ease;
  }
  button#stopBtn:active{
    transform:translateY(6px);
    box-shadow:0 2px 0 #6B0D10, 0 6px 14px rgba(0,0,0,.4);
  }
  button#stopBtn:disabled{ opacity:.5; cursor:not-allowed; }

  .footnote{
    margin-top:16px;
    font-size:12px;
    color:var(--cream-dim);
    opacity:.75;
  }

  /* ---- Overlay ---- */
  .overlay{
    position:fixed; inset:0;
    background:rgba(10,7,5,.72);
    backdrop-filter:blur(3px);
    display:flex;align-items:center;justify-content:center;
    opacity:0; pointer-events:none;
    transition:opacity .3s ease;
    z-index:20;
    padding:20px;
  }
  .overlay.show{opacity:1;pointer-events:auto;}
  .prize-card{
    background:linear-gradient(160deg, #4A0C0F, var(--bg-panel));
    border:1px solid rgba(253,209,52,.4);
    border-radius:22px;
    padding:34px 28px;
    max-width:340px;
    text-align:center;
    transform:scale(.85) translateY(10px);
    transition:transform .35s cubic-bezier(.2,.9,.3,1.3);
    box-shadow:0 20px 50px rgba(0,0,0,.5);
  }
  .overlay.show .prize-card{transform:scale(1) translateY(0);}
  .prize-card .tag{
    font-size:12px;
    letter-spacing:.3em;
    text-transform:uppercase;
    margin-bottom:10px;
  }
  .prize-card.win .tag{ color:var(--paprika); }
  .prize-card.lose .tag{ color:var(--cream-dim); }
  .prize-card h2{
    font-family:'Rakkas', serif;
    font-size:28px;
    margin:0 0 14px;
  }
  .prize-card.win h2{ color:var(--gold); }
  .prize-card.lose h2{ color:var(--cream); }
  .prize-card p{
    color:var(--cream-dim);
    font-size:14px;
    line-height:1.8;
    margin:0 0 22px;
  }
  .prize-card button.action{
    font-family:'Tajawal';
    font-weight:700;
    font-size:15px;
    background:transparent;
    border:1.5px solid var(--gold);
    color:var(--gold);
    padding:10px 26px;
    border-radius:999px;
    cursor:pointer;
  }
  .prize-card button.action:hover{background:rgba(253,209,52,.12);}

  .start-panel{margin-bottom:18px;}
  .start-btn{font-family:'Tajawal';font-weight:900;font-size:18px;color:var(--cream);background:linear-gradient(180deg,#FDD134,#D99500);border:none;border-radius:999px;padding:14px 44px;cursor:pointer;box-shadow:0 7px 0 #8B5B00,0 12px 22px rgba(0,0,0,.35);}
  .start-btn:active{transform:translateY(4px);box-shadow:0 3px 0 #8B5B00;}
  .status{font-size:12px;color:var(--cream-dim);margin-top:10px;min-height:18px;}
  .countdown{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(10,7,5,.58);z-index:15;opacity:0;pointer-events:none;transition:opacity .15s;}
  .countdown.show{opacity:1;}
  .countdown span{font-family:'Rakkas';font-size:clamp(80px,25vw,150px);color:var(--gold);text-shadow:0 8px 30px rgba(0,0,0,.65);}
  .prize-code{font-family:monospace;letter-spacing:.18em;font-size:18px;color:var(--gold);background:rgba(0,0,0,.25);border:1px dashed rgba(253,209,52,.55);border-radius:12px;padding:10px 12px;margin:14px 0 8px;direction:ltr;}
  .prize-meta{font-size:11px;color:var(--cream-dim);line-height:1.7;}
  .security-note{font-size:10px;color:var(--cream-dim);opacity:.8;margin-top:12px;}
  .result-icon{font-size:42px;margin-bottom:4px;}

  .game-hud{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:12px auto 0;max-width:900px;flex-wrap:wrap}
  .hud-pill{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-radius:999px;padding:8px 14px;font-weight:700;color:#fff}
  .accuracy{font-size:14px;color:#fdd134}
  .gold-zone{position:absolute;z-index:4;border:3px dashed #fdd134;border-radius:50%;box-shadow:0 0 22px rgba(253,209,52,.55);pointer-events:none;display:none}
  .gold-zone.show{display:block}
  .pulse{animation:pulse .35s ease-out}
  @keyframes pulse{50%{transform:scale(1.04)}}
  .countdown span{font-weight:900}
  .prize-code{letter-spacing:3px;user-select:all}
  .copy-btn{margin-top:10px;background:transparent!important;border:1px solid rgba(255,255,255,.18)!important;color:#fff!important}
</style>
</head>

<script>
const track = document.getElementById('track');
const chicken = document.getElementById('chicken');
const zone = document.getElementById('zone');
const zoneImg = document.getElementById('zoneImg');
const stopBtn = document.getElementById('stopBtn');
const startBtn = document.getElementById('startBtn');
const statusEl = document.getElementById('status');
const overlay = document.getElementById('overlay');
const card = document.getElementById('card');
const tag = document.getElementById('tag');
const resultIcon = document.getElementById('resultIcon');
const resultTitle = document.getElementById('resultTitle');
const resultText = document.getElementById('resultText');
const prizeCodeEl = document.getElementById('prizeCode');
const prizeMeta = document.getElementById('prizeMeta');
const securityNote = document.getElementById('securityNote');
const closeBtn = document.getElementById('closeBtn');
const copyBtn = document.getElementById('copyBtn');
const accuracyEl = document.getElementById('accuracy');
const levelEl = document.getElementById('level');
const timerEl = document.getElementById('timer');
const goldZone = document.getElementById('goldZone');
const countdown = document.getElementById('countdown');
const countdownText = document.getElementById('countdownText');

// Configure prizes here. probability is relative weight, not a guarantee.
const WIN_PRIZES = [
  {name:'Frite', probability:50},
  {name:'Jus', probability:25},
  {name:'Chicken Rice', probability:15},
  {name:'Turkish', probability:10}
];
const COOLDOWN_MS = 24 * 60 * 60 * 1000;
const STORAGE_KEY = 'machawi_chicken_game_v2';

let logoAspect = 489 / 400;
zoneImg.addEventListener('load', () => {
  if (zoneImg.naturalWidth && zoneImg.naturalHeight) logoAspect = zoneImg.naturalHeight / zoneImg.naturalWidth;
});

let trackWidth, trackHeight, chickenWidth, zoneStart, zoneWidth;
let x = 0, dir = 1, speed = 0, rafId = null, running = false, played = false, runStartedAt = 0, finalAccuracy = 0, currentLevel = 1;
const MAX_RUN_MS = 5000;
let maxRunTimeoutId = null;

function getState(){ try{return JSON.parse(localStorage.getItem(STORAGE_KEY)||'null');}catch(e){return null;} }
function setState(state){ try{localStorage.setItem(STORAGE_KEY,JSON.stringify(state));}catch(e){} }
function canPlay(){
  const st=getState();
  if(!st || !st.playedAt) return true;
  return Date.now()-st.playedAt >= COOLDOWN_MS;
}
function remainingText(){
  const st=getState(); if(!st||!st.playedAt) return '';
  const ms=Math.max(0,COOLDOWN_MS-(Date.now()-st.playedAt));
  const h=Math.floor(ms/3600000), m=Math.floor((ms%3600000)/60000);
  return `يمكنك اللعب مرة أخرى بعد ${h} ساعة و${m} دقيقة.`;
}
function updateAvailability(){
  if(canPlay()){
    startBtn.disabled=false; startBtn.textContent='ابدأ اللعب 🎮';
    statusEl.textContent='محاولة واحدة كل 24 ساعة لهذا الجهاز.';
  }else{
    startBtn.disabled=true; statusEl.textContent=remainingText();
  }
}
function randomCode(){
  const alphabet='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  let out='MD-';
  if(window.crypto && crypto.getRandomValues){
    const a=new Uint32Array(8); crypto.getRandomValues(a);
    a.forEach(n=>out+=alphabet[n%alphabet.length]);
  }else{ for(let i=0;i<8;i++) out+=alphabet[Math.floor(Math.random()*alphabet.length)]; }
  return out;
}
function weightedPrize(){
  const total=WIN_PRIZES.reduce((a,p)=>a+p.probability,0);
  let r=Math.random()*total;
  for(const p of WIN_PRIZES){ r-=p.probability; if(r<=0) return p.name; }
  return WIN_PRIZES[0].name;
}
function formatDate(ts){ return new Intl.DateTimeFormat('fr-MA',{dateStyle:'short',timeStyle:'short'}).format(new Date(ts)); }

function layout(){
  trackWidth=track.clientWidth; trackHeight=track.clientHeight; chickenWidth=chicken.offsetWidth;
  const padding=10, maxZoneHeight=trackHeight-padding*2;
  const scaleFactor=Math.max(0.52,0.82-(currentLevel-1)*0.05)+Math.random()*0.08;
  const zoneHeight=Math.min(maxZoneHeight,maxZoneHeight*scaleFactor);
  zoneWidth=zoneHeight/logoAspect;
  zoneStart=Math.random()*Math.max(0,trackWidth-zoneWidth);
  const zoneTop=(trackHeight-zoneHeight)/2;
  zone.style.width=zoneWidth+'px'; zone.style.height=zoneHeight+'px';
  zone.style.left=zoneStart+'px'; zone.style.top=zoneTop+'px';
  const goldW=zoneWidth*0.42, goldH=zoneHeight*0.42;
  goldZone.style.width=goldW+'px'; goldZone.style.height=goldH+'px';
  goldZone.style.left=(zoneStart+(zoneWidth-goldW)/2)+'px'; goldZone.style.top=(zoneTop+(zoneHeight-goldH)/2)+'px';
}
function resetChicken(){
  x=0; dir=1; chicken.style.left='0px';
  chicken.classList.remove('walk-l'); chicken.classList.add('walk-r');
  speed=(6.5+Math.random()*3.5)*(1+(currentLevel-1)*0.08);
}
function loop(){
  if(!running)return;
  x+=speed*dir; const maxX=trackWidth-chickenWidth;
  if(x<=0){x=0;dir=1;chicken.classList.remove('walk-l');chicken.classList.add('walk-r');}
  if(x>=maxX){x=maxX;dir=-1;chicken.classList.remove('walk-r');chicken.classList.add('walk-l');}
  chicken.style.left=x+'px';
  timerEl.textContent=((performance.now()-runStartedAt)/1000).toFixed(1);
  rafId=requestAnimationFrame(loop);
}
function beginRun(){
  layout(); resetChicken(); runStartedAt=performance.now(); timerEl.textContent='0.0'; accuracyEl.textContent='—'; running=true; stopBtn.disabled=false; stopBtn.textContent='قف! ✋'; loop();
  if(maxRunTimeoutId) clearTimeout(maxRunTimeoutId);
  maxRunTimeoutId=setTimeout(()=>{ if(running && !played) stopRun(); }, MAX_RUN_MS);
}
function countdownStart(){
  let n=3; countdown.classList.add('show'); countdownText.textContent=n;
  const timer=setInterval(()=>{
    n--;
    if(n>0){countdownText.textContent=n;}
    else {clearInterval(timer);countdownText.textContent='ابدأ!';setTimeout(()=>{countdown.classList.remove('show');beginRun();},350);}
  },650);
}
function startRun(){
  if(played || !canPlay()) return;
  startBtn.disabled=true; statusEl.textContent='استعد...'; countdownStart();
}
function stopRun(){
  if(!running || played)return;
  if(maxRunTimeoutId){ clearTimeout(maxRunTimeoutId); maxRunTimeoutId=null; }
  running=false; cancelAnimationFrame(rafId); stopBtn.disabled=true;
  const chickenCenter=x+chickenWidth/2;
  const zoneEnd=zoneStart+zoneWidth;
  const isWin=chickenCenter>=zoneStart && chickenCenter<=zoneEnd;
  setTimeout(()=>showResult(isWin),250);
}
function showResult(isWin){
  played=true;
  const playedAt=Date.now();
  const center=x+chickenWidth/2;
  const zoneCenter=zoneStart+zoneWidth/2;
  const distance=Math.abs(center-zoneCenter);
  const maxDistance=Math.max(1,zoneWidth/2);
  finalAccuracy=Math.max(0,Math.round((1-distance/maxDistance)*100));
  const goldStart=zoneStart+zoneWidth*0.29, goldEnd=zoneStart+zoneWidth*0.71;
  const jackpot=center>=goldStart && center<=goldEnd;
  const realWin=isWin;
  accuracyEl.textContent=finalAccuracy+'%';
  const state={playedAt,won:realWin,accuracy:finalAccuracy,gold:jackpot,code:realWin?randomCode():null,prize:realWin?weightedPrize():null};
  setState(state);
  card.className='prize-card '+(realWin?'win':'lose');
  resultIcon.textContent=realWin?(jackpot?'🌟':'🏆'):'🐔';
  if(realWin){
    tag.textContent=jackpot?'دقة ممتازة! 🌟':'مبروك!';
    resultTitle.textContent=state.prize;
    resultText.textContent=`أوقفت الدجاجة بدقة ${finalAccuracy}%. احتفظ بالكود وأظهره للنادل.`;
    prizeCodeEl.style.display='block'; prizeCodeEl.textContent=state.code;
    copyBtn.style.display='block';
    prizeMeta.textContent=`الإصدار: ${formatDate(playedAt)} • الصلاحية: 24 ساعة`;
    securityNote.textContent='🔐 كود فريد لهذه الجولة. التحقق النهائي من الاستعمال يتم عند ربط اللعبة بنظام المطعم.';
  }else{
    tag.textContent='قريب!'; resultTitle.textContent='هربت منك 🐔';
    resultText.textContent=`دقتك ${finalAccuracy}%. حاول مرة أخرى عندما تصبح المحاولة متاحة.`;
    prizeCodeEl.style.display='none'; copyBtn.style.display='none';
    prizeMeta.textContent='هذه الجولة احتُسبت كمحاولة واحدة.';
    securityNote.textContent='⏳ الانتظار يحمي اللعبة من المحاولات المتكررة.';
  }
  overlay.classList.add('show');
}

startBtn.addEventListener('click',startRun);
stopBtn.addEventListener('click',stopRun);
copyBtn.addEventListener('click',async()=>{ try{await navigator.clipboard.writeText(prizeCodeEl.textContent); copyBtn.textContent='تم نسخ الكود ✓'; setTimeout(()=>copyBtn.textContent='نسخ كود الجائزة 📋',1500);}catch(e){copyBtn.textContent='حدد الكود وانسخه';} });
closeBtn.addEventListener('click',()=>{overlay.classList.remove('show');updateAvailability();});
window.addEventListener('resize',()=>{if(running)layout();});
updateAvailability();
</script>
</body>
</html>
